intro:
  title: Dimelo!
  body: >
    I’m the founder and CEO of [Capicú](https://capicu.ai).

    While founding Capicú, I earned my B.S. in [Computer Science & Engineering](https://www.uprm.edu/cse/es/)
    from the University of Puerto Rico at Mayagüez. Under the advisement of
    [Dr. Wilfredo Lugo Beauchamp](http://linkedin.com/in/wilfredo-lugo-beauchamp-0b083838/),
    I worked on applied Edge AI for remote smart health and computer vision applications.

    I’m currently pursuing an M.S. in Bioengineering, studying how mechanical
    cues affect extracellular vesicle (EV) production under the advisement of
    [Dr. Maribella Domenech](https://www.linkedin.com/in/maribella-domenech-7ab17526/)
    and in collaboration with the [NSF AIRFoundry](https://airfoundry.upenn.edu).

    My career goal is to develop efficient and intelligent systems
    that can be deployed directly where biomedical data is collected, bringing supercomputing
    capabilities to environments with limited infrastructure.